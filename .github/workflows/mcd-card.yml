name: Update Profile Cards

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00，即北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js and dependency cache
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install card dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Generate GitHub cards
        run: npm run generate:github-cards
        env:
          PAT_1: ${{ secrets.GH_STATS_TOKEN }}
      - name: Generate McReadme card
        uses: colorfulee/McReadme-Card@main
        with:
          mcd_token: ${{ secrets.MCD_MCP_TOKEN }}
          theme: receipt
          commit: 'false'
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/top-langs.svg mcd-card.svg .mcd-card/history.json
          if git diff --cached --quiet; then
            echo "Cards unchanged"
            exit 0
          fi
          git commit -m "chore: 更新主页卡片"
          git push
